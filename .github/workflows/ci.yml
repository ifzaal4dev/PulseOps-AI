name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.17"
      - run: ruff check .
      - run: ruff format --check .

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/pyproject.toml
            apps/api/pyproject.toml
      - name: Install packages
        run: |
          pip install -e "ml[dev]"
          pip install -e "apps/api[dev]"
      - name: Backend tests (SQLite, includes migration tests)
        run: python -m pytest apps/api/tests -q
      - name: ML tests (fixture-based, no dataset download)
        run: python -m pytest ml/tests -q -p no:cacheprovider
      - name: Agent eval (fails on any safety gate)
        run: python eval/run_eval.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-eval-report
          path: eval/reports/

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: pulseops
          POSTGRES_DB: pulseops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulseops -d pulseops"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PULSEOPS_TEST_DATABASE_URL: postgresql+psycopg://pulseops:pulseops@localhost:5432/pulseops
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/pyproject.toml
            apps/api/pyproject.toml
      - name: Install packages
        run: |
          pip install -e "ml[dev]"
          pip install -e "apps/api[dev]"
      - name: Backend tests (PostgreSQL 16)
        run: python -m pytest apps/api/tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
