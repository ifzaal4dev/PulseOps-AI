[project]
name = "pulseops-api"
version = "0.1.0"
description = "PulseOps AI backend — agentic reliability engine for smart facilities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.17",
]
# Live LLM providers (optional; deterministic mode needs none of these).
llm = [
    "google-genai>=1.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulseops_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
